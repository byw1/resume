# Deploys site/ — the hired.tools landing page — to GitHub Pages on every push
# that touches it. One-time setup in the repo: Settings → Pages → Source:
# GitHub Actions. Then point hired.tools DNS at GitHub Pages and the CNAME
# file in site/ does the rest.
name: Publish the landing page

on:
  push:
    branches: [main]
    paths: [site/**]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
